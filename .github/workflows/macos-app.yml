name: macOS App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python3 scripts/package-macos.py --app
      - run: python3 scripts/check-macos-package.py Consultorio-macOS-arm64-App-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Consultorio-macOS-App
          path: Consultorio-macOS-arm64-App-*.zip
          retention-days: 14
